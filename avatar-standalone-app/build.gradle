plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.sousa.avatar.standalone'
    compileSdk 36

    defaultConfig {
        applicationId 'com.sousa.avatar.standalone'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    androidResources {
        // Avatar GLBs/JSON are mapped straight from the APK by the engine; deflating them forces a
        // full 20-28 MB inflate on every body load. Library modules cannot set this for the app.
        noCompress += ['glb', 'json']
    }
}

dependencies {
    implementation project(':avatar-bridge')
    implementation project(':avatar-module-android')

    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'com.google.code.gson:gson:2.11.0'
    androidTestImplementation 'com.squareup.okhttp3:okhttp:4.12.0'
    androidTestImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.core:core-ktx:1.13.1'
}
